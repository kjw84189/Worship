<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>찬양팀 악보</title>
<meta name="apple-mobile-web-app-title" content="찬양팀 악보">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#2E3440">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<meta property="og:title" content="대원교회 찬양팀 악보">
<meta property="og:description" content="히엘워십 · 금요찬양팀 D-wave">
<meta property="og:image" content="icon-512.png">
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font:18px/1.6 "Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",sans-serif;color:#1C2230;background:#F2F2F0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 18px;word-break:keep-all}
h1{font-size:24px;margin:0 0 4px;text-align:center}
p{margin:0 0 22px;color:#566070;font-size:16px;text-align:center}
.w{width:min(440px,100%)}
a.team{display:flex;align-items:center;gap:16px;min-height:92px;border-radius:18px;padding:16px 18px;margin:0 0 14px;color:#fff;text-decoration:none;font-weight:700;font-size:20px}
a.team img{width:60px;height:60px;border-radius:14px;flex:none;box-shadow:0 0 0 1px rgba(255,255,255,.25)}
a.team small{display:block;font-weight:400;font-size:15px;opacity:.85}
.hiel{background:linear-gradient(120deg,#5B4B3A,#7A6A55)}
.dwave{background:linear-gradient(120deg,#14213A,#1E3A5C)}
a.team:focus-visible{outline:3px solid #E2A33B;outline-offset:3px}
.tip{font-size:14px;color:#566070;text-align:center;margin-top:8px}
</style>
</head>
<body>
<div class="w">
  <h1>대원교회 찬양팀 악보</h1>
  <p>우리 팀을 눌러 들어가세요</p>
  <a class="team hiel" href="hiel/"><img src="hiel/icon-192.png" alt=""><span>히엘워십<small>Hiel Worship</small></span></a>
  <a class="team dwave" href="dwave/"><img src="dwave/icon-192.png" alt=""><span>D-wave 워십<small>금요찬양팀</small></span></a>
  <div class="tip">홈 화면에 추가하면 앱처럼 쓸 수 있어요</div>
</div>
</body>
</html>
