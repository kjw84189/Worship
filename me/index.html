<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>편곡 노트</title>
<meta name="apple-mobile-web-app-title" content="편곡 노트">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#1D2B2A">
<meta name="robots" content="noindex">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="manifest" href="manifest.json">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@600&display=swap" rel="stylesheet">
<style>
/* ── 색 ── 깊은 녹흑: 머리 띠 / 황동색: 지금 고른 것·녹음 / 회녹 종이: 바탕 */
:root{--ink:#1D2B2A;--ink2:#2E4442;--brass:#C9A24A;--rec:#D23B3B;--text:#1B2120;--sub:#56625F;--line:#D5DBD8;--bg:#EDF0EE;--paper:#fff;--blue:#1F5FD1}
*{box-sizing:border-box;min-width:0}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.65 "Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;word-break:keep-all;overflow-wrap:anywhere}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
button:focus-visible,a:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px}
header.top{background:var(--ink);color:#fff;padding:12px 0;padding-top:max(12px,env(safe-area-inset-top))}
header.top .wrap{display:flex;align-items:center;gap:12px}
header h1{margin:0;font:600 21px/1.3 "Noto Serif KR",serif;flex:1;display:flex;align-items:center;gap:10px}
header h1 img{width:34px;height:34px;border-radius:8px}
header h1 small{display:block;font:400 13px/1.3 "Noto Sans KR",sans-serif;opacity:.75}
.chip{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.25);border-radius:99px;padding:6px 14px;min-height:40px;font-size:15px}
main{padding:14px 0 90px}
.tabs{display:grid;grid-template-columns:repeat(6,1fr);gap:8px;margin:0 0 14px}
@media (max-width:560px){.tabs{grid-template-columns:repeat(3,1fr);gap:6px}}
a.tab{display:flex;align-items:center;justify-content:center;gap:5px;text-decoration:none}
.tab.ext.suno{background:#16181D;border-color:#16181D;color:#fff}
.tab.ext.yt{background:#fff;border-color:#E5322D;color:#C4231F}
.tab.ext.yt span{color:#fff;background:#E5322D;border-radius:6px;font-size:11px;padding:2px 6px}
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{text-align:center;font-size:13px;color:var(--sub);font-weight:700;padding:4px 0}
.cday{min-height:64px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px;text-align:left;display:flex;flex-direction:column;gap:2px;font:inherit;color:var(--ink);overflow:hidden}
.cday .dn{font-size:14px;font-weight:700}
.cday.sun .dn{color:#C4231F}.cday.sat .dn{color:#1F5FD1}
.cday.today{border:2px solid var(--brass)}.cday.sel{background:#F3EEDD;border-color:var(--ink)}
.cday .dots{display:flex;flex-wrap:wrap;gap:3px}
.cday .dots i{width:8px;height:8px;border-radius:50%;display:block}
.dt-song{background:#B08A3E}.dt-rec{background:#D0262F}.dt-hiel{background:#5B4B3A}.dt-dwave{background:#1F7A8C}
.legend{display:flex;flex-wrap:wrap;gap:12px;font-size:14px;color:var(--sub);margin:10px 0}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:middle}
.ev{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-bottom:8px;font:inherit;color:var(--ink);min-height:52px}
.ev i{width:10px;height:10px;border-radius:50%;flex:none}.ev .k{font-size:14px;color:var(--sub)}
.tab{flex:1;min-height:50px;border:2px solid var(--line);background:#fff;border-radius:12px;font-weight:700;color:var(--sub)}
.tab.on{border-color:var(--ink);color:var(--ink);box-shadow:inset 0 -4px 0 var(--brass)}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:16px}
.list{display:flex;flex-direction:column;gap:10px}
.item{display:block;width:100%;text-align:left;background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px}
.item:hover{border-color:var(--ink)}
.item b{font-size:19px}
.item .m{color:var(--sub);font-size:15px}
.kind{display:inline-block;font-size:13px;font-weight:700;border-radius:99px;padding:1px 10px;margin-left:6px;vertical-align:2px;background:#E7EEEC;color:var(--ink2)}
.kind.작곡{background:#F3EAD3;color:#6B5212}
.kind.번안곡{background:#E3EEF7;color:#1F4E79}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;min-height:48px;padding:10px 18px;border-radius:12px;border:0;font-weight:700;background:var(--ink);color:#fff;text-decoration:none}
.btn.line{background:#fff;color:var(--ink);border:2px solid var(--ink)}
.btn.red{background:var(--rec)}
.btn.wide{width:100%}
.btn[disabled]{opacity:.5;cursor:wait}
.row{display:flex;gap:10px;flex-wrap:wrap}.row>*{flex:1}
.trow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tb{min-width:44px;min-height:44px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:4px 12px;font-size:15px;display:inline-flex;align-items:center;justify-content:center;gap:4px}
.tb.on{border:2px solid var(--ink);box-shadow:inset 0 -3px 0 var(--brass);font-weight:700}
.small{font-size:14px;color:var(--sub)}
.err{color:var(--rec);font-weight:700}
.empty{padding:36px 10px;text-align:center;color:var(--sub)}
.loading{padding:36px 0;text-align:center;color:var(--sub)}
.search{width:100%;min-height:50px;border:2px solid var(--line);border-radius:12px;padding:8px 14px;background:#fff;margin-bottom:12px}
.bar{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.bar{flex-wrap:wrap}.bar h2{margin:0;font-size:21px;flex:1 1 180px;line-height:1.35}
.back{background:none;border:0;color:var(--ink);font-weight:700;min-height:44px;padding:0}
h3.sec{font-size:18px;margin:24px 0 10px}
label.f{display:block;font-weight:700;margin:12px 0 6px}
.in{width:100%;min-height:48px;border:2px solid var(--line);border-radius:12px;padding:9px 12px;background:#fff}
textarea.in{min-height:90px;resize:vertical;line-height:1.55}
.ver{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:12px}
.ver h4{margin:0;font-size:18px}
.files{display:flex;flex-direction:column;gap:8px;margin-top:10px}
.file{display:flex;flex-wrap:wrap;align-items:center;gap:8px;border:1px solid var(--line);border-radius:10px;padding:6px 10px;background:#FAFBFA}
.file .n{flex:1 1 160px;font-size:15px}
.file audio{width:100%;margin-top:6px}
.audiowrap{flex-basis:100%}
pre.ly{white-space:pre-wrap;font:inherit;line-height:1.8;background:var(--bg);border-radius:10px;padding:12px;margin:8px 0 0}
.form{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0;align-items:center}
.lk{display:flex;flex-direction:column;gap:8px;margin:10px 0 4px}
.lk a{display:flex;align-items:center;gap:12px;min-height:56px;padding:6px 12px 6px 6px;border:1px solid var(--line);border-radius:12px;background:#fff;color:var(--ink);text-decoration:none;position:relative}
.lk a:active{background:var(--bg)}
.lk img{width:96px;height:54px;object-fit:cover;border-radius:8px;flex:none;background:#222}
.lk .pl{position:absolute;left:41px;top:50%;transform:translateY(-50%);width:28px;height:20px;border-radius:6px;background:#E5322D;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center}
.lk .ic{width:44px;text-align:center;font-size:20px;flex:none}
.lk b{font-size:16px;line-height:1.4;word-break:break-all}
.form span{border:1px solid var(--line);border-radius:8px;padding:1px 8px;background:#fff;font-weight:700;color:var(--ink)}
.memo{white-space:pre-wrap}
/* 녹음 */
.recbox{text-align:center;padding:26px 10px 20px}
.recbtn{width:132px;height:132px;border-radius:50%;border:6px solid #fff;background:var(--rec);box-shadow:0 0 0 2px var(--rec);color:#fff;font-size:18px;font-weight:700}
.recbtn.on{border-radius:28%;background:#7a1f1f;box-shadow:0 0 0 2px #7a1f1f}
.timer{font:600 38px/1.2 ui-monospace,Menlo,Consolas,monospace;margin:14px 0 4px;color:var(--ink)}
.meter{height:10px;background:#dfe4e2;border-radius:99px;overflow:hidden;max-width:360px;margin:10px auto 0}
.meter i{display:block;height:100%;width:0;background:var(--brass);transition:width .08s}
/* 악보·필기 */
.tools{position:sticky;top:0;z-index:20;background:rgba(237,240,238,.96);backdrop-filter:blur(6px);margin:0 -16px 10px;padding:8px 16px;border-bottom:1px solid var(--line)}
.dot{width:20px;height:20px;border-radius:50%;display:inline-block;border:2px solid #fff;box-shadow:0 0 0 1px #9aa}
.pages{display:flex;flex-direction:column;gap:14px}
.pg{position:relative;background:#fff;box-shadow:0 1px 4px rgba(20,30,30,.15);border-radius:4px;overflow:hidden}
.pg .sc{display:block;width:100%;height:auto}
.pg canvas.ink{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.drawing .pg canvas.ink{pointer-events:auto;touch-action:none}
.pages.flip{position:fixed;inset:0;z-index:80;background:#3A3F47;display:block;overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none;margin:0;padding:0}
.pages.flip .pg{position:absolute;margin:0;box-shadow:0 2px 14px rgba(0,0,0,.45)}
.pages.flip .pg .pgno{opacity:.7}
.pages.flip .pg .sc{pointer-events:none;-webkit-user-drag:none;user-select:none}
.pages.flip.drawing.penonly .pg canvas.ink{touch-action:none}
body.flipping{overflow:hidden}
#flipbar{position:fixed;top:0;left:0;right:0;z-index:81;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:6px 8px;padding-top:max(6px,env(safe-area-inset-top));background:rgba(24,28,36,.95);color:#fff}
#flipbar[hidden]{display:none}
#flipbar button,#flipbar select{min-height:42px;border-radius:10px;border:1px solid rgba(255,255,255,.3);background:transparent;color:#fff;font:inherit;font-size:15px;padding:0 11px;cursor:pointer}
#flipbar select option{color:#111}
#flipbar button.on{background:#fff;color:#1C2230;border-color:#fff;font-weight:700}
#flipbar button:disabled{opacity:.35}
#flipbar .pgi{margin-left:auto;font-weight:700;font-variant-numeric:tabular-nums;padding:0 6px;white-space:nowrap}

.drawing.penonly .pg canvas.ink{touch-action:pan-x pan-y}
.pgno{position:absolute;right:8px;bottom:6px;font-size:12px;color:#8a93a3;background:rgba(255,255,255,.85);border-radius:6px;padding:0 6px}
.save{font-size:13px;color:var(--sub);margin-left:auto}
.modal{position:fixed;inset:0;background:rgba(15,25,25,.55);z-index:50;display:grid;place-items:center;padding:16px;overflow:auto}
.modal .card{width:min(520px,100%)}
.modal h3{margin:0 0 6px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:99px;z-index:60;font-size:15px}
.teamsw{display:flex;gap:8px;margin-bottom:12px;align-items:center}
.teamfr{display:block;border:0;width:100vw;margin-left:calc(50% - 50vw);height:calc(100vh - 175px);height:calc(100dvh - 175px);min-height:520px;background:#EFECE6}
.teamsw button{flex:1;min-height:46px;border-radius:12px;border:2px solid var(--line);background:#fff;font-weight:700}
.teamsw button.on.hiel{background:#5B4B3A;color:#fff;border-color:#5B4B3A}
.teamsw button.on.dwave{background:#1B2A45;color:#fff;border-color:#1B2A45}
.month{font-size:16px;color:var(--ink);margin:18px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.song{background:#fff;border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:10px}
.song h4{margin:0 0 4px;font-size:18px}
.song .no{display:inline-block;min-width:30px;background:var(--ink);color:#fff;border-radius:8px;text-align:center;font-size:14px;padding:0 7px;margin-right:6px}
details summary{cursor:pointer;font-weight:700;color:var(--ink);min-height:40px;display:flex;align-items:center}
.lock{max-width:380px;margin:60px auto}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <h1><img src="icon-192.png" alt=""><span>편곡 노트<small>곽지웅 · 작곡·편곡 작업실</small></span></h1>
  <button class="chip" id="lockBtn" hidden>잠그기</button>
</div></header>
<main class="wrap" id="app"><div class="loading">여는 중…</div></main>
<div id="modalRoot"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
(function(){
/* ✏️ 서버 주소 (Apps Script 배포 주소) */
const API_URL = 'https://script.google.com/macros/s/AKfycbxk7qM6FzQyV_Czc4-XtQDc1AiAAgVwdRpDp28_4f-Mp7nNwzXmkVs_gx3_r7INpswm6Q/exec';

const $app = document.getElementById('app'), $modal = document.getElementById('modalRoot');
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const LS = { get(k, d){ try { const v = localStorage.getItem(k); return v == null ? d : JSON.parse(v); } catch(e){ return d; } }, set(k, v){ try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, JSON.stringify(v)); } catch(e){} } };
let PW = LS.get('arr-pw', ''), view = { tab: 'songs' }, SONGS = null, RECS = null, TEAM = {}, songOpts = [], LIB = null;
const DAYS = ['일','월','화','수','목','금','토'];
function toast(m){ const t = document.createElement('div'); t.className = 'toast'; t.textContent = m; document.body.appendChild(t); setTimeout(() => t.remove(), 2400); }
function nowStr(){ const d = new Date(), p = n => String(n).padStart(2, '0'); return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes()); }
function dateText(d){ const m = /^(\d{4})-(\d\d)-(\d\d)/.exec(d || ''); if (!m) return d || ''; const dt = new Date(+m[1], +m[2] - 1, +m[3]); return (+m[2]) + '월 ' + (+m[3]) + '일 (' + DAYS[dt.getDay()] + ')'; }
function fmtSec(s){ s = Math.round(s || 0); return Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0'); }
function sizeText(b){ return b > 1048576 ? (b / 1048576).toFixed(1) + 'MB' : Math.max(1, Math.round(b / 1024)) + 'KB'; }

async function api(fn, ...args){
  if (window.DEMO_API) return window.DEMO_API(PW, fn, args);
  if (!API_URL || API_URL.indexOf('__') === 0) throw new Error('서버 주소가 아직 없어요');
  const r = await fetch(API_URL, { method: 'POST', body: JSON.stringify({ pw: PW, fn, args }) });
  const j = await r.json();
  if (!j.ok) { if (/비밀번호/.test(j.error)) { PW = ''; LS.set('arr-pw', null); } throw new Error(j.error); }
  return j.data;
}
function readFile(f){ return new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res({ name: f.name, mime: f.type || 'application/octet-stream', b64: String(r.result).split(',')[1] }); r.onerror = rej; r.readAsDataURL(f); }); }
function b64bytes(b){ const s = atob(b), u = new Uint8Array(s.length); for (let i = 0; i < s.length; i++) u[i] = s.charCodeAt(i); return u; }
const FILECACHE = {};
async function fileURL(fid){ if (FILECACHE[fid]) return FILECACHE[fid]; const f = await api('getFile', fid); const u = { url: URL.createObjectURL(new Blob([b64bytes(f.b64)], { type: f.mime })), mime: f.mime, b64: f.b64, name: f.name }; FILECACHE[fid] = u; return u; }
function modal(html, on){ $modal.innerHTML = '<div class="modal" role="dialog" aria-modal="true"><div class="card">' + html + '</div></div>'; const m = $modal.firstChild; on && on(m); const f = m.querySelector('input:not([type=file]),textarea'); f && f.focus(); return m; }
function closeModal(){ $modal.innerHTML = ''; }

/* 송폼 가사 */
/* ── 송폼 규칙 ──
   A1·A2 = A파트 1절·2절, B1·B2 = 후렴 1절·2절 (각자 가사)
   송폼은 적은 그대로 표시 · I(8) = Intro 8마디 · A1(+2) = 2마디 쉬고 · Bx2 = 두 번 반복 · Bis = 끝부분 반복(Bisx3 = 세 번) · Tag = 삽입곡·따로 편곡한 부분 = B 두 번 반복(가사도 두 번)
   I/In=Intro, It/Int=Inter, O/Out=Outro, Ed/End=Ending 으로 읽음 */
const INSTR = /^[\(\[]?\s*(intro|inter|interlude|outro|ending|solo|pad|rit|간주|전주|후주|인트로|인터|아웃트로|엔딩|솔로|패드|기도|멘트)/i;
const ABBR = [[/^(i|in|intro)$/i, 'Intro'], [/^(it|int|inter|interlude)$/i, 'Inter'], [/^(o|out|outro)$/i, 'Outro'], [/^(ed|end|ending)$/i, 'Ending']];
/* 괄호 밖의 쉼표로 나누기: "A,B,C" → A · B · C (가사 펼칠 때만) */
function splitTop(t){ const out = []; let d = 0, cur = ''; for (const ch of t) { if (ch === '(' || ch === '[') d++; else if ((ch === ')' || ch === ']') && d) d--; if (ch === ',' && !d) { out.push(cur); cur = ''; } else cur += ch; } out.push(cur); return out.map(x => x.trim()).filter(Boolean); }
function formItems(f, split){ const out = [];
  const toks = []; String(f || '').split(/[\/|→\n]+/).map(t => t.trim()).filter(Boolean).forEach(t => { const P = split ? splitTop(t) : [t]; P.length > 1 ? P.forEach(x => toks.push(x)) : toks.push(t); });
  toks.forEach(t => {
    let rep = 1, bars = 0, m; const label = t.replace(/\s+/g, ' ');
    // 앞에 붙은 메모·키업 표시는 빼고 파트 이름을 찾음: "(Key up to F) C" · "Key up 3절" · "키업 B"
    { const r = t.replace(/^\s*[\(\[][^\)\]]*[\)\]]\s*/, '').replace(/^\s*(key\s*-?\s*up|키\s*업|전조|up)\b\s*/i, '').replace(/^\s*(키\s*업|전조)\s*/, ''); if (r.trim() && r !== t) t = r; }
    // x2 · Dx2(drum) · B(+1)x2 → 반복 횟수
    if ((m = /\s*[x×*]\s*(\d+)\s*(?=([\(\[][^\)\]]*[\)\]])?\s*$)/i.exec(t))) { rep = Math.min(9, +m[1] || 1); t = t.slice(0, m.index) + t.slice(m.index + m[0].length); }
    const head = t.trim().replace(/\s+/g, ' ');
    m = /^\s*([A-Za-z][A-Za-z'’\-]*\d*|[가-힣]+\d*)\s*(.*)$/.exec(t) || /^\s*([^\(\[]*?)\s*([\(\[].*)?$/.exec(t) || [t, t.trim(), ''];
    m[2] = m[2] || '';
    if (!m[1]) { m[1] = t.trim(); m[2] = ''; } if (!m[1]) return;
    let name = m[1], extra = m[2].replace(/\s+/g, ' ').replace(/\s*([\(\)\[\]+])\s*/g, '$1').trim();
    ABBR.forEach(([re, full]) => { if (re.test(name)) name = full; });
    const b = /^[\(\[]?(\d+)(?:마디)?[\)\]]?$/.exec(extra); if (b) { bars = +b[1]; extra = ''; }
    const pm = /\+\s*(\d+)/.exec(extra), plus = pm ? +pm[1] : 0;
    // 키업(Gkey)D 처럼 끝에 파트 이름이 붙은 경우 → D 가사를 씀
    const tail = (/\)\s*([A-Za-z]\d*)$/.exec(extra) || [])[1] || '';
    out.push({ name, bars, plus, rep, head, label, tail }); });
  return out; }
function parseForm(f){ return formItems(f).map(i => i.label); }
function formNames(f){ const all = [...new Set(formItems(f, true).map(i => i.name))];
